<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elenco & Maestria — Protótipo Fiel da Interface</title>
  <style>
    :root {
      --bg-teal-deep: #07191d;
      --bg-teal-main: #0b272c;
      --bg-teal-light: #0f363c;
      --bg-teal-card: #0d2a2f;
      --border-teal: #194f57;
      --border-teal-glow: #22d3ee;
      --border-gold: #d4af37;
      --text-teal-bright: #5eead4;
      --text-teal-muted: #81a8ab;
      --text-white: #f0fdfa;
      --star-gold: #facc15;
      --star-empty: #335357;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #0d383e 0%, #071c20 60%, #040f12 100%);
      color: var(--text-white);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    /* Subtle background speed lines / geometric streaks matching the reference */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        -35deg,
        transparent,
        transparent 60px,
        rgba(34, 211, 238, 0.015) 60px,
        rgba(34, 211, 238, 0.015) 120px
      );
      pointer-events: none;
    }

    /* TOP NAVIGATION BAR */
    .top-nav {
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(25, 79, 87, 0.6);
      background: rgba(7, 25, 29, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .btn-voltar {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-teal-muted);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s, transform 0.2s;
    }

    .btn-voltar:hover {
      color: #fff;
      transform: translateX(-3px);
    }

    .center-tabs {
      display: flex;
      background: #061619;
      border: 1px solid var(--border-teal);
      border-radius: 6px;
      overflow: hidden;
    }

    .nav-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 24px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-teal-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.2s;
    }

    .nav-tab.active {
      background: #0f393f;
      color: #fff;
      box-shadow: inset 0 0 10px rgba(94, 234, 212, 0.2);
    }

    .nav-tab:hover:not(.active) {
      color: var(--text-white);
      background: rgba(15, 57, 63, 0.4);
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-bar {
      position: relative;
    }

    .search-bar input {
      background: #061619;
      border: 1px solid var(--border-teal);
      border-radius: 6px;
      padding: 7px 12px 7px 32px;
      font-size: 0.85rem;
      color: #fff;
      outline: none;
      width: 220px;
      transition: border-color 0.2s, width 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--text-teal-bright);
      width: 260px;
    }

    .search-bar span {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      color: var(--text-teal-muted);
    }

    .dropdown-filter {
      background: #061619;
      border: 1px solid var(--border-teal);
      border-radius: 6px;
      padding: 7px 16px;
      color: var(--text-teal-muted);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dropdown-filter:hover {
      border-color: var(--text-teal-bright);
      color: #fff;
    }

    /* SUB-HEADER / MAESTRIA INFO */
    .subheader {
      padding: 24px 48px 16px 48px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    .maestria-info h2 {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .maestria-info h2 .gold-star {
      color: var(--star-gold);
      font-size: 1.3rem;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
    }

    .maestria-info p {
      font-size: 0.95rem;
      color: var(--text-teal-muted);
      margin-top: 4px;
    }

    .status-toggle {
      display: flex;
      background: #061619;
      border: 1px solid var(--border-teal);
      border-radius: 4px;
      overflow: hidden;
    }

    .status-btn {
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text-teal-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .status-btn.active {
      background: #114249;
      color: #fff;
    }

    /* HEROES GRID */
    .roster-container {
      flex: 1;
      padding: 8px 48px 48px 48px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    .heroes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 20px 16px;
    }

    @media (min-width: 1200px) {
      .heroes-grid {
        grid-template-columns: repeat(10, 1fr);
      }
    }

    @media (max-width: 1199px) and (min-width: 900px) {
      .heroes-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    @media (max-width: 899px) {
      .heroes-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* INDIVIDUAL HERO CARD */
    .hero-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
      position: relative;
    }

    .hero-card:hover {
      transform: translateY(-6px);
    }

    .portrait-wrap {
      width: 100%;
      aspect-ratio: 1 / 1.15;
      background: #092025;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(34, 211, 238, 0.25);
      position: relative;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .hero-card:hover .portrait-wrap {
      border-color: var(--text-teal-bright);
      box-shadow: 0 0 16px rgba(94, 234, 212, 0.35);
    }

    .portrait-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }

    .hero-card:hover .portrait-img {
      transform: scale(1.06);
    }

    /* Fallback stylized canvas / avatar if image is generated */
    .portrait-avatar {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #123d44 0%, #081d22 100%);
      position: relative;
    }

    .avatar-icon {
      font-size: 2.4rem;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
    }

    .locked-card .portrait-wrap {
      border-color: #1e3538;
      filter: grayscale(1) opacity(0.5);
    }

    .locked-card:hover .portrait-wrap {
      border-color: #4b666a;
      box-shadow: none;
    }

    .stars-row {
      display: flex;
      gap: 3px;
      margin-top: 6px;
      font-size: 0.85rem;
    }

    .star-filled {
      color: var(--star-gold);
      text-shadow: 0 0 6px rgba(250, 204, 21, 0.4);
    }

    .star-empty {
      color: var(--star-empty);
    }

    .hero-name {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      margin-top: 3px;
      color: #e2e8f0;
      text-transform: uppercase;
      text-align: center;
      transition: color 0.2s;
    }

    .hero-card:hover .hero-name {
      color: var(--text-teal-bright);
    }

    .locked-card .hero-name {
      color: #64748b;
    }

    /* MODAL: HERO SHEET (FICHA DE COLEÇÃO - ESTILO NYX 09) */
    .sheet-modal {
      position: fixed;
      inset: 0;
      background: rgba(4, 15, 18, 0.95);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
    }

    .sheet-modal.active {
      display: flex;
    }

    .sheet-top-nav {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(25, 79, 87, 0.5);
    }

    .sheet-close-btn {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid #f43f5e;
      color: #f43f5e;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .sheet-close-btn:hover {
      background: #f43f5e;
      color: #fff;
    }

    /* MINI HERO SELECTOR CAROUSEL AT MODAL TOP */
    .sheet-carousel {
      max-width: 1400px;
      width: 100%;
      margin: 16px auto;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: thin;
      scrollbar-color: #194f57 transparent;
    }

    .carousel-thumb {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      border: 1px solid var(--border-teal);
      background: #081d22;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    .carousel-thumb:hover, .carousel-thumb.selected {
      border-color: var(--text-teal-bright);
      box-shadow: 0 0 10px rgba(94, 234, 212, 0.5);
      transform: translateY(-2px);
    }

    /* SHEET CONTENT LAYOUT */
    .sheet-body {
      max-width: 1400px;
      width: 100%;
      margin: 20px auto;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 40px;
      align-items: start;
    }

    @media (max-width: 980px) {
      .sheet-body {
        grid-template-columns: 1fr;
      }
    }

    /* LEFT: HERO FULL BODY */
    .sheet-hero-art {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(13, 42, 47, 0.4) 0%, rgba(7, 25, 29, 0.8) 100%);
      border: 1px solid var(--border-teal);
      border-radius: 12px;
      padding: 32px 20px;
      position: relative;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .sheet-hero-art .art-avatar {
      font-size: 8rem;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
    }

    .hero-art-name {
      margin-top: 20px;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero-art-stars {
      color: var(--star-gold);
      font-size: 1.4rem;
    }

    .hero-tags-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .hero-class-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid var(--text-teal-bright);
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-teal-bright);
    }

    /* RIGHT: TECHNIQUES & TABS */
    .sheet-details {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sub-tabs-row {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-teal);
      padding-bottom: 12px;
    }

    .sub-tab-btn {
      background: #092025;
      border: 1px solid var(--border-teal);
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-teal-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .sub-tab-btn.active {
      background: #114249;
      color: #fff;
      border-color: var(--text-teal-bright);
      box-shadow: 0 0 10px rgba(94, 234, 212, 0.25);
    }

    .sub-tab-btn.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* TECHNIQUES GRID (4 CARDS LIKE REFERENCE 09) */
    .techniques-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .tech-card {
      background: #0a1f24;
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s;
    }

    .tech-card:hover {
      transform: translateY(-4px);
    }

    .tech-header-icon {
      align-self: center;
      width: 44px;
      height: 44px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--border-gold);
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
      margin-bottom: 14px;
    }

    .tech-header-icon span {
      transform: rotate(-45deg);
      font-size: 1.2rem;
    }

    .tech-title {
      font-size: 0.95rem;
      font-weight: 900;
      color: #fff;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tech-type {
      font-size: 0.72rem;
      color: var(--text-teal-muted);
      text-align: center;
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .tech-desc {
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.5;
      flex-grow: 1;
    }

    .tech-mana {
      color: #38bdf8;
      font-weight: 700;
    }

    .tech-maestria-footer {
      margin-top: 14px;
      padding-top: 8px;
      border-top: 1px solid rgba(25, 79, 87, 0.4);
      font-size: 0.72rem;
      color: var(--star-gold);
      text-align: center;
      font-weight: 700;
    }

    /* FOOTER INFO */
    .footer-note {
      text-align: center;
      padding: 24px;
      color: var(--text-teal-muted);
      font-size: 0.85rem;
      border-top: 1px solid rgba(25, 79, 87, 0.5);
      margin-top: auto;
    }
  </style>
</head>

  <!-- TOP NAVIGATION BAR -->
  <header class="top-nav">
    <a href="index.html" class="btn-voltar">
      <span>&#9664;</span> VOLTAR ÀS REFERÊNCIAS
    </a>

    <div class="center-tabs">
      <button class="nav-tab active">
        <span>&#9638;</span> HERÓIS

    <div class="right-controls">
      <div class="search-bar">

        <span>&#9660;</span> Tudo

  <!-- SUBHEADER MAESTRIA -->

      <p>Ganhe um troféu por vencer com cada Especialização de nível B.</p>
    </div>

    <div class="status-toggle">
      <button class="status-btn active" id="btnAll" onclick="setStatusFilter('all')">Tudo</button>
      <button class="status-btn" id="btnIncomplete" onclick="setStatusFilter('incomplete')">Incompleta</button>
    </div>
  </section>

  <!-- HEROES GRID -->
  <main class="roster-container">
    <div class="heroes-grid" id="heroesGrid">
      <!-- Cards rendered via JS -->
    </div>
  </main>

  <!-- MODAL: FICHA DE HERÓI (ESTILO NYX / RATNA) -->
  <div class="sheet-modal" id="heroModal">

      <button class="btn-voltar" onclick="closeHeroModal()">
        <span>&#9664;</span> VOLTAR AO ELENCO

      <button class="sheet-close-btn" onclick="closeHeroModal()">
        &#10005; Fechar

    </div>

    <!-- Mini Carousel Topo -->
    <div class="sheet-carousel" id="modalCarousel"></div>

    <!-- Sheet Body -->
    <div class="sheet-body">

      <div class="sheet-hero-art">
        <div class="art-avatar" id="modalAvatar">&#129497;</div>
        <div class="hero-art-name">
          <span id="modalHeroName">NYX</span>
          <span class="hero-art-stars" id="modalHeroStars">&#9733;&#9733;&#9733;</span>
        </div>
        <div class="hero-tags-row" id="modalTags">
          <span class="hero-class-tag">&#9876; DUELISTA</span>
          <span class="hero-class-tag">&#9889; ÍMPETO</span>
        </div>
      </div>

      <!-- Coluna Direita: Técnicas & Abas -->
      <div class="sheet-details">
        <div class="sub-tabs-row">
          <button class="sub-tab-btn active">TÉCNICAS</button>
          <button class="sub-tab-btn locked">&#128274; JOGABILIDADE</button>
          <button class="sub-tab-btn">PERSONALIDADE</button>
        </div>

        <div class="techniques-grid" id="modalTechniques">
          <!-- 4 Cards de Técnicas inseridos dinamicamente -->
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-note">

    let currentFilter = 'all';

    function renderHeroes() {
      const grid = document.getElementById('heroesGrid');
      grid.innerHTML = '';

      const term = document.getElementById('heroSearch').value.toLowerCase().trim();

      HEROES.forEach(hero => {
        // Filter search
        if (term && !hero.name.toLowerCase().includes(term)) {
          return;
        }

        // Filter incomplete/locked
        if (currentFilter === 'incomplete' && (!hero.locked && hero.stars === 3)) {
          return;
        }

        const card = document.createElement('div');
        card.className = `hero-card ${hero.locked ? 'locked-card' : ''}`;
        card.onclick = () => {
          if (!hero.locked) {
            openHeroModal(hero);
          } else {
            alert('Este herói ainda está bloqueado na sua coleção!');
          }
        };

        // Build Stars HTML
        let starsHtml = '';
        if (hero.locked) {
          starsHtml = '<span class="star-empty">&#9733;&#9733;&#9733;</span>';
        } else {
          for (let i = 1; i <= 3; i++) {
            starsHtml += i <= hero.stars ? '<span class="star-filled">&#9733;</span>' : '<span class="star-empty">&#9733;</span>';
          }
        }

        card.innerHTML = `
          <div class="portrait-wrap">
            <div class="portrait-avatar">
              <span class="avatar-icon">${hero.icon}</span>
            </div>
          </div>
          <div class="stars-row">${starsHtml}</div>
          <div class="hero-name">${hero.name}</div>
        `;

        grid.appendChild(card);
      });
    }

    function filterHeroes() {
      renderHeroes();
    }

    function setStatusFilter(status) {
      currentFilter = status;
      document.getElementById('btnAll').classList.toggle('active', status === 'all');
      document.getElementById('btnIncomplete').classList.toggle('active', status === 'incomplete');
      renderHeroes();
    }

    function toggleFilter() {
      const f = document.getElementById('filterStatus');
      if (currentFilter === 'all') {
        setStatusFilter('incomplete');
        f.innerHTML = '<span>&#9660;</span> Incompleta';
      } else {
        setStatusFilter('all');
        f.innerHTML = '<span>&#9660;</span> Tudo';
      }
    }

    // MODAL FUNCTIONS
    function openHeroModal(hero) {
      document.getElementById('modalHeroName').textContent = hero.name.toUpperCase();
      document.getElementById('modalAvatar').textContent = hero.icon;

      let starsHtml = '';
      for (let i = 1; i <= 3; i++) {
        starsHtml += i <= hero.stars ? '&#9733;' : '☆';
      }
      document.getElementById('modalHeroStars').innerHTML = starsHtml;

      // Tags
      const tagsContainer = document.getElementById('modalTags');
      tagsContainer.innerHTML = '';
      hero.classes.forEach(cls => {
        const span = document.createElement('span');
        span.className = 'hero-class-tag';
        span.innerHTML = `&#9876; ${cls}`;
        tagsContainer.appendChild(span);
      });

      // Techniques
      const techContainer = document.getElementById('modalTechniques');
      techContainer.innerHTML = '';
      hero.techniques.forEach(tech => {
        const tCard = document.createElement('div');
        tCard.className = 'tech-card';
        tCard.innerHTML = `
          <div class="tech-header-icon"><span>${tech.icon}</span></div>
          <div class="tech-title">${tech.name}</div>
          <div class="tech-type">${tech.type}</div>
          <div class="tech-desc">${tech.desc}</div>
          <div class="tech-maestria-footer">&#9733; Maestria disponível</div>
        `;
        techContainer.appendChild(tCard);
      });

      // Populate Mini Carousel
      const carousel = document.getElementById('modalCarousel');
      carousel.innerHTML = '';
      HEROES.filter(h => !h.locked).forEach(h => {
        const thumb = document.createElement('div');
        thumb.className = `carousel-thumb ${h.id === hero.id ? 'selected' : ''}`;
        thumb.innerHTML = `<span>${h.icon}</span>`;
        thumb.title = h.name;
        thumb.onclick = () => openHeroModal(h);
        carousel.appendChild(thumb);
      });

      document.getElementById('heroModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeHeroModal() {
      document.getElementById('heroModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    // ESC key closes modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeHeroModal();
    });

    // Initial render
    renderHeroes();
  </script>
